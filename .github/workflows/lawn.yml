# Redraws the lawn in the README: my recent contributions as a meadow (scripts/lawn.py).
# The two images are published to the `output` branch, which the README links to.
name: Mow the lawn

on:
  schedule:
    - cron: "23 */4 * * *" # every four hours, so "last mowed: today" stays true
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lawn.yml, scripts/lawn.py]

permissions:
  contents: write

concurrency:
  group: lawn
  cancel-in-progress: true

jobs:
  mow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to an exact commit so it cannot change underneath me.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draw the lawn
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/lawn.py --user "$GITHUB_REPOSITORY_OWNER" --out dist

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lawn.svg lawn-dark.svg
          git commit --quiet --message "Mow the lawn"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
